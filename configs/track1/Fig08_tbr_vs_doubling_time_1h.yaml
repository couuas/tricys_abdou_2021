  optimization:
    track: track1_basis
    track1:
      mode: direct
      interpolation_method: pchip
      subgrid_nadir_refinement: true
    outer:
      target_metric:
        source: comp11_Storage.inventory
        evaluate: min_value
        threshold_source: comp11_Storage.I_reserve_req
        comparator: '>='
    inner:
      metric_name: Required_TBR
      parameter: Lambda
      target_metric:
        source: comp11_Storage.inventory
        evaluate: doubling_time
        threshold:
        - 8766.0
        - 26298.0
        - 43830.0
        - 61362.0
        comparator: <=
plugins:
  postprocess:
  - name: abdou_fig08_tbr_vs_doubling_time_1h
    params:
      dpi: 300
