    track: track2_bisection
    algorithm: nested_bisection
    outer:
      parameter: I_S_0
      search_bounds:
      - 1000.0
      - 100000.0
      tolerance: 20.0
      max_iterations: 10
      target_metric:
        source: comp11_Storage.inventory
        evaluate: min_value
        threshold_source: comp11_Storage.I_reserve_req
        comparator: '>='
    inner:
      metric_name: Required_TBR
      parameter: Lambda
      search_bounds:
      - 1.0
      - 1.5
      tolerance: 0.002
      max_iterations: 10
      target_metric:
        source: comp11_Storage.inventory
        evaluate: doubling_time
        threshold: 43830.0
