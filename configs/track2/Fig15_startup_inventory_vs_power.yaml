  optimization:
    track: track2_bisection
    algorithm: nested_bisection
    outer:
      parameter: I_S_0
      search_bounds:
      - 10.0
      - 50000.0
      tolerance: 5.0
      max_iterations: 14
      target_metric:
        source: comp11_Storage.inventory
        evaluate: min_value
        threshold_source: comp11_Storage.I_reserve_req
        comparator: '>='
    inner:
      metric_name: Required_TBR
      parameter: Lambda
      search_bounds:
      - 1.0
      - 2.5
      tolerance: 0.002
      max_iterations: 10
      target_metric:
        source: comp11_Storage.inventory
        evaluate: doubling_time
        threshold: 43830.0
        comparator: <=
plugins:
  postprocess:
  - name: abdou_fig15_startup_inventory_vs_power
    params:
      dpi: 300
visualizer:
  enabled: true
  launch_on_finish: false
  report:
    enabled: true
    title: 'Abdou 2021 Figure 15: Start-up Inventory Linear Scaling with Fusion Power
      (100 - 3000 MW)'
    formats:
    - markdown
    - json
