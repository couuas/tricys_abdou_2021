version: '2.0'
model:
  fileName: ../../models/Abdou2021.mo
  modelName: Abdou2021.Cycle
scenario:
  time_base: second
  startTime: 0.0
  stopTime: 50000.0
  stepSize: 50.0
  method: dassl
  tolerance: 1e-4
  variableFilter: time|comp11_Storage.inventory|comp11_Storage.I_reserve_req|plant_total_inv|plant_mass_residual
task:
  type: optimize
  track: track2_bisection
  algorithm: nested_bisection
  outer:
    parameter: I_S_0
    search_bounds:
    - 10000.0
    - 50000.0
    tolerance: 10.0
    max_iterations: 10
    target_metric:
      source: comp11_Storage.inventory
      evaluate: min_value
      threshold_source: comp11_Storage.I_reserve_req
      comparator: '>='
  inner:
    metric_name: Required_TBR
    parameter: Lambda
    search_bounds:
    - 1.0
    - 1.25
    tolerance: 0.002
    max_iterations: 10
    target_metric:
      source: comp11_Storage.inventory
      evaluate: doubling_time
      threshold: 43830.0
      comparator: <=
  parameters:
    P_fus: 3000.0
    AF: 1.0
    f_b: 0.025
    eta_f: 0.4
    t_r: 24.0
    q_fail: 0.25
    f_DIR: 0.0
